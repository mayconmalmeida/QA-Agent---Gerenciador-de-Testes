name: Smoke Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to use'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      max_parallel:
        description: 'Max parallel tests'
        required: true
        default: '2'
        type: string

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
      fail-fast: false

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('**/pom.xml') }}

    - name: Instalar Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install ${{ matrix.browser }}"

    - name: Compilar projeto
      run: mvn clean compile -q

    - name: Executar testes smoke
      env:
        QA_USUARIO: ${{ secrets.QA_USUARIO }}
        QA_SENHA: ${{ secrets.QA_SENHA }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        HEADLESS: "true"
        BROWSER: ${{ matrix.browser }}
      run: |
        # Executa testes com a nova arquitetura
        mvn test -Dtest=GenericTest -Dheadless=true -Dbrowser=${{ matrix.browser }} || true

    - name: Gerar Timeline Report
      if: always()
      run: |
        # Gera relatório de timeline se houver resultados
        if [ -f "data/execution_results.json" ]; then
          echo "Timeline report data available"
        fi

    - name: Upload relatório HTML
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-report-${{ matrix.browser }}
        path: |
          output/reports/*.html
          data/execution_results.json
        retention-days: 30

    - name: Upload screenshots e videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-evidence-${{ matrix.browser }}
        path: |
          output/screenshots/
          output/videos/
        retention-days: 7

    - name: Comentar resultado no PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let summary = '### 🧪 Smoke Test Results\n\n';
          summary += '| Browser | Status |\n';
          summary += '|---------|--------|\n';
          const status = '${{ job.status }}' === 'success' ? '✅ Pass' : '❌ Fail';
          summary += '| ${{ matrix.browser }} | ' + status + ' |\n\n';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
